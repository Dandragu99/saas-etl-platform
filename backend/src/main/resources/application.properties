spring.application.name=saas-etl-backend
spring.servlet.multipart.max-file-size=5242880B
spring.servlet.multipart.max-request-size=6291456B
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:55432/saas_etl}
spring.datasource.username=${DATABASE_USERNAME:saas_etl}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=SPRING_SESSION
spring.session.timeout=30m
server.servlet.session.cookie.name=NEXO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
nexo.security.cookie-secure=${SESSION_COOKIE_SECURE:false}
