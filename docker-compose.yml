
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: saas_etl
      POSTGRES_USER: saas_etl
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - saas_etl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_etl -d saas_etl"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  saas_etl_postgres_data:
