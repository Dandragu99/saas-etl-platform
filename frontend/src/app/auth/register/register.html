<main class="auth-card" aria-labelledby="register-title">
  <a class="brand" routerLink="/login" aria-label="Nexo ERP">
    <span class="brand-mark" aria-hidden="true">N</span><strong>Nexo ERP</strong>
  </a>
  <h1 id="register-title">Crea tu empresa</h1>
  <p class="intro">Tu cuenta se asociará como propietaria de un nuevo espacio empresarial.</p>

  @if (errorMessage()) {
    <p class="request-error" role="alert">{{ errorMessage() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      Correo electrónico
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field-error">Introduce un correo electrónico válido.</span>
      }
    </label>
    <label>
      Contraseña
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field-error">Usa entre 12 y 72 caracteres.</span>
      }
    </label>
    <label>
      Nombre de la empresa
      <input type="text" formControlName="companyName" autocomplete="organization" />
      @if (form.controls.companyName.touched && form.controls.companyName.invalid) {
        <span class="field-error">El nombre de empresa es obligatorio.</span>
      }
    </label>
    <label>
      Moneda predeterminada
      <select formControlName="defaultCurrency">
        <option value="EUR">EUR — Euro</option>
        <option value="USD">USD — Dólar estadounidense</option>
        <option value="GBP">GBP — Libra esterlina</option>
      </select>
    </label>
    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Creando cuenta…' : 'Crear cuenta' }}
    </button>
  </form>
  <p class="alternative">¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a></p>
</main>
