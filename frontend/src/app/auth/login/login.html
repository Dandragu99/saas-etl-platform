<main class="auth-card" aria-labelledby="login-title">
  <a class="brand" routerLink="/login" aria-label="Nexo ERP, inicio de sesión">
    <span class="brand-mark" aria-hidden="true">N</span><strong>Nexo ERP</strong>
  </a>
  <h1 id="login-title">Accede a tu espacio</h1>
  <p class="intro">Gestiona tus transformaciones y empresas desde una sesión segura.</p>

  @if (registered) {
    <p class="success-message" role="status">Cuenta creada. Ya puedes iniciar sesión.</p>
  }
  @if (errorMessage()) {
    <p class="request-error" role="alert">{{ errorMessage() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      Correo electrónico
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field-error">Introduce un correo electrónico válido.</span>
      }
    </label>
    <label>
      Contraseña
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field-error">La contraseña es obligatoria.</span>
      }
    </label>
    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Accediendo…' : 'Iniciar sesión' }}
    </button>
  </form>
  <p class="alternative">¿Todavía no tienes cuenta? <a routerLink="/registro">Crear cuenta</a></p>
</main>
